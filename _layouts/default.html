<!DOCTYPE html>
<html lang="en-US" class="dm-root">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.summary | default: site.description | escape }}">
<meta name="color-scheme" content="dark only">
<meta name="theme-color" content="#0E141B">
<link rel="icon" type="image/png" href="{{ '/assets/favicon.png' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/icon.png' | relative_url }}">
<style>
/* DroneMap preflight palette: night slate ground, amber warning ink. */
:root{
  --dm-ground:#0E141B;
  --dm-ground-raised:#151D26;
  --dm-ridge:#233040;
  --dm-ink:#FFFFFF;
  --dm-ink-soft:#A3B1C0;
  --dm-ink-faint:#7C8B9B;
  --dm-amber:#FFB020;
  --dm-amber-dim:rgba(255,176,32,.14);
  --dm-measure:44rem;
  --dm-gutter:clamp(16px,4vw,32px);
  --dm-face:ui-sans-serif,-apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  --dm-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
html.dm-root{background:var(--dm-ground);-webkit-text-size-adjust:100%;}
body.dm-body{margin:0;background:var(--dm-ground);color:var(--dm-ink-soft);font-family:var(--dm-face);font-size:17px;line-height:1.6}
.dm-body *,.dm-body *::before,.dm-body *::after{box-sizing:border-box}

.dm-strip{border-bottom:1px solid var(--dm-ridge);background:var(--dm-ground-raised)}
.dm-strip-inner{max-width:var(--dm-measure);margin-inline:auto;padding:14px var(--dm-gutter);display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.dm-brand{display:flex;align-items:center;gap:10px;color:var(--dm-ink);text-decoration:none}
.dm-brand-mark{width:36px;height:36px;border-radius:9px}
.dm-brand-text{display:flex;flex-direction:column;line-height:1.2}
.dm-brand-name{font-weight:700;font-size:1.05rem}
.dm-brand-line{font-family:var(--dm-mono);font-size:.72rem;color:var(--dm-amber);letter-spacing:.03em}

.dm-menu{list-style:none;margin:0;padding:0;display:flex;gap:4px}
.dm-menu-link{display:block;padding:6px 10px;color:var(--dm-ink-soft);text-decoration:none;font-size:.9rem;border-bottom:2px solid transparent}
.dm-menu-link:hover{color:var(--dm-ink)}
.dm-menu-link[aria-current="page"]{color:var(--dm-ink);border-bottom-color:var(--dm-amber)}

.dm-page{max-width:var(--dm-measure);margin-inline:auto;padding:28px var(--dm-gutter) 40px}
.dm-page h1{color:var(--dm-ink);font-size:clamp(1.6rem,5vw,2.1rem);line-height:1.2;margin:0 0 .5em}
.dm-page h2{color:var(--dm-ink);font-size:1.2rem;margin:2.2em 0 .5em;padding-top:.9em;border-top:1px solid var(--dm-ridge)}
.dm-page h3{color:var(--dm-amber);font-size:1rem;margin:1.6em 0 .3em}
.dm-page strong{color:var(--dm-ink)}
.dm-page a{color:var(--dm-amber);text-underline-offset:3px}
.dm-page p,.dm-page li{overflow-wrap:anywhere}
.dm-page ul,.dm-page ol{padding-left:1.3em}
.dm-page li+li{margin-top:.35em}
.dm-page blockquote{margin:1.2em 0;padding:.6em 1em;border-left:4px solid var(--dm-amber);background:var(--dm-amber-dim)}
.dm-page blockquote p{margin:.3em 0;color:var(--dm-ink)}
.dm-page code{font-family:var(--dm-mono);font-size:.88em;color:var(--dm-ink)}
.dm-page table{display:block;overflow-x:auto;border-collapse:collapse;margin:1.2em 0;font-size:.92rem}
.dm-page th,.dm-page td{padding:8px 10px;border:1px solid var(--dm-ridge);text-align:left;vertical-align:top}
.dm-page th{color:var(--dm-ink);background:var(--dm-ground-raised)}
.dm-page dt{color:var(--dm-ink);font-weight:700;margin-top:1em}
.dm-page dd{margin:.2em 0 0 0}

.dm-base{border-top:1px solid var(--dm-ridge)}
.dm-base-inner{max-width:var(--dm-measure);margin-inline:auto;padding:18px var(--dm-gutter) 36px;font-size:.84rem;color:var(--dm-ink-faint)}
.dm-base-inner a{color:var(--dm-ink-soft)}
.dm-base-row{margin:.25em 0}

@media (max-width:480px){
  body.dm-body{font-size:16px}
  .dm-strip-inner{padding-block:10px}
  .dm-menu-link{padding:6px 8px}
}
</style>
</head>
<body class="dm-body">
<div class="dm-strip">
  <div class="dm-strip-inner">
    <a class="dm-brand" href="{{ '/' | relative_url }}">
      <img class="dm-brand-mark" src="{{ '/assets/icon.png' | relative_url }}" width="36" height="36" alt="">
      <span class="dm-brand-text"><span class="dm-brand-name">DroneMap</span><span class="dm-brand-line">terrain &amp; RTH preflight</span></span>
    </a>
    <nav aria-label="Site pages">
      <ul class="dm-menu">
        <li><a class="dm-menu-link" href="{{ '/' | relative_url }}"{% if page.dm_section == "help" %} aria-current="page"{% endif %}>Help</a></li>
        <li><a class="dm-menu-link" href="{{ '/privacy' | relative_url }}"{% if page.dm_section == "privacy" %} aria-current="page"{% endif %}>Privacy</a></li>
        <li><a class="dm-menu-link" href="{{ '/terms' | relative_url }}"{% if page.dm_section == "terms" %} aria-current="page"{% endif %}>Terms (EULA)</a></li>
      </ul>
    </nav>
  </div>
</div>
<article class="dm-page">
{{ content }}
</article>
<div class="dm-base">
  <div class="dm-base-inner">
    <p class="dm-base-row">DroneMap for iPhone is built and maintained by Tigran Barseghyan. Write to <a href="mailto:developer.barseghyan@gmail.com">developer.barseghyan@gmail.com</a>.</p>
    <p class="dm-base-row">Ground heights come from AWS Open Data Terrain Tiles. Base map by Apple Maps.</p>
  </div>
</div>
</body>
</html>
